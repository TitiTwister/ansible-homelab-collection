---
# Handlers for the dcgm_exporter role. Order matters: containerd
# before docker (docker depends on it), docker before dcgm-exporter.

- name: Restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    daemon_reload: true

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true

- name: Restart dcgm-exporter
  ansible.builtin.systemd:
    name: dcgm-exporter
    state: restarted
    daemon_reload: true
