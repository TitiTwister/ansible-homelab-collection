---
# DCGM exporter service: pinned container image, systemd-managed.

- name: Pull the DCGM exporter image
  # Layer downloads from nvcr.io are prone to transient connection
  # resets; docker resumes already-downloaded layers on retry.
  ansible.builtin.command:
    cmd: docker pull {{ dcgm_exporter_image }}
  register: dcgm_exporter_image_pull
  until: dcgm_exporter_image_pull.rc == 0
  retries: 5
  delay: 30
  changed_when: "'Downloaded newer image' in dcgm_exporter_image_pull.stdout"

- name: Deploy DCGM exporter systemd service
  ansible.builtin.template:
    src: dcgm-exporter.service.j2
    dest: /etc/systemd/system/dcgm-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart dcgm-exporter

- name: Enable and start DCGM exporter
  ansible.builtin.systemd:
    name: dcgm-exporter
    state: started
    enabled: true
    daemon_reload: true
