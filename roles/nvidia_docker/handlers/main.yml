---
# Handlers for nvidia_docker role. Order matters: containerd before
# docker (docker depends on it). GPU services (vllm, comfyui) are not
# restarted here: their units run with Restart=always and
# Requires=docker.service, so systemd brings them back after a docker
# restart.

- name: Restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    daemon_reload: true

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
