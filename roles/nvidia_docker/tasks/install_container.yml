---
# Docker CE with the NVIDIA Container Toolkit, following the same dual
# repository pattern as the k8s role's containerd setup. The nvidia
# runtime is registered in daemon.json; GPU service units select it
# explicitly with --runtime nvidia --gpus all.

- name: Add Docker CE repository (RHEL)
  ansible.builtin.yum_repository:
    name: docker-ce
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/rhel/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/rhel/gpg
    enabled: true
  when: ansible_facts.distribution == "RedHat"

- name: Add Docker CE repository (Rocky/Alma/CentOS)
  ansible.builtin.yum_repository:
    name: docker-ce
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/centos/gpg
    enabled: true
  when: ansible_facts.distribution in ["Rocky", "AlmaLinux", "CentOS"]

- name: Add NVIDIA Container Toolkit repository
  ansible.builtin.yum_repository:
    name: nvidia-container-toolkit
    description: NVIDIA Container Toolkit
    baseurl: https://nvidia.github.io/libnvidia-container/stable/rpm/$basearch
    gpgcheck: true
    gpgkey: https://nvidia.github.io/libnvidia-container/gpgkey
    enabled: true

- name: Install Docker CE and NVIDIA Container Toolkit
  ansible.builtin.dnf:
    name: "{{ __nvidia_docker_container_packages }}"
    state: present

- name: Create Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy containerd configuration
  # Docker 28 uses the containerd image store: image layers live in
  # containerd's data root, not in Docker's data-root. Relocate it to
  # the data disk - the system volume is too small for multi-GB CUDA
  # images.
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Deploy Docker daemon configuration
  # Do NOT set log-driver=journald here: GPU service units run
  # `docker run` in the foreground, so container stdout already lands
  # in journald under the unit name (and from there in Loki). A
  # journald log driver would duplicate every line.
  ansible.builtin.template:
    src: docker-daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
