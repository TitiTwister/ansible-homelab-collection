---
# Install Alertmanager on Rocky Linux

- name: Add Alertmanager user
  ansible.builtin.user:
    name: alertmanager
    system: true
    shell: /bin/false
    home: "{{ prometheus_alertmanager_config_dir }}"
    create_home: false

- name: Create Alertmanager directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: alertmanager
    group: alertmanager
    mode: '0755'
  loop:
    - "{{ prometheus_alertmanager_config_dir }}"
    - "{{ prometheus_alertmanager_data_dir }}"

- name: Download Alertmanager
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/alertmanager/releases/download/v{{
      prometheus_alertmanager_version }}/alertmanager-{{ prometheus_alertmanager_version }}.linux-amd64.tar.gz"
    dest: "/tmp/alertmanager-{{ prometheus_alertmanager_version }}.linux-amd64.tar.gz"
    mode: '0644'

- name: Extract Alertmanager
  ansible.builtin.unarchive:
    src: "/tmp/alertmanager-{{ prometheus_alertmanager_version }}.linux-amd64.tar.gz"
    dest: /tmp/
    remote_src: true
    creates: "/tmp/alertmanager-{{ prometheus_alertmanager_version }}.linux-amd64"

- name: Install Alertmanager binaries
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ prometheus_alertmanager_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: '0755'
    remote_src: true
  loop:
    - alertmanager
    - amtool

- name: Create Alertmanager systemd service
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    mode: '0644'
  notify: restart alertmanager

- name: Enable Alertmanager service
  ansible.builtin.systemd:
    name: alertmanager
    enabled: true
    daemon_reload: true
