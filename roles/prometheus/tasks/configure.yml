---
# Configure Prometheus

- name: Ensure Prometheus file_sd directory exists
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}/file_sd"
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'

- name: Deploy Prometheus node file_sd targets
  ansible.builtin.template:
    src: file_sd_node.yml.j2
    dest: "{{ prometheus_config_dir }}/file_sd/node.yml"
    owner: prometheus
    group: prometheus
    mode: '0644'
  notify: restart prometheus

- name: Deploy Prometheus postgres file_sd targets
  ansible.builtin.template:
    src: file_sd_postgres.yml.j2
    dest: "{{ prometheus_config_dir }}/file_sd/postgres.yml"
    owner: prometheus
    group: prometheus
    mode: '0644'
  notify: restart prometheus

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: prometheus
    group: prometheus
    mode: '0644'
  notify: restart prometheus

- name: Start Prometheus service
  ansible.builtin.systemd:
    name: prometheus
    state: started
