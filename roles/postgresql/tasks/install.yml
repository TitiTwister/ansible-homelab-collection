---
# Install PostgreSQL, Patroni and etcd from PGDG / distribution repositories

# dnf refreshes enabled-repo metadata even for a direct-URL install, so this
# transaction must not consult PGDG: on hosts still carrying the broken
# per-minor repository definition it would fail before the template task
# below can repair it. The glob covers pgdg-common and pgdg<major>.
- name: Install PGDG repository RPM
  ansible.builtin.dnf:
    name: "{{ postgresql_pgdg_repo_url }}"
    state: present
    disable_gpg_check: true
    disablerepo: "pgdg*"
  become: true

- name: Deploy managed PGDG repository definition
  ansible.builtin.template:
    src: pgdg-redhat-all.repo.j2
    dest: /etc/yum.repos.d/pgdg-redhat-all.repo
    owner: root
    group: root
    mode: "0644"
  when: postgresql_pgdg_manage_repo | bool
  become: true

- name: Install PostgreSQL server and contrib packages
  ansible.builtin.dnf:
    name: "{{ postgresql_packages }}"
    state: present
  become: true

- name: Validate extension package mappings
  ansible.builtin.assert:
    that: postgresql_extensions | difference(postgresql_extension_packages.keys() | list) | length == 0
    fail_msg: >-
      No package mapping for extension(s):
      {{ postgresql_extensions | difference(postgresql_extension_packages.keys() | list) | join(', ') }}.
      Extensions shipped in postgresql{{ postgresql_version }}-contrib need no postgresql_extensions entry.
  when: postgresql_extensions | length > 0

- name: Install extension packages on every node
  ansible.builtin.dnf:
    name: "{{ postgresql_extensions | map('extract', postgresql_extension_packages) | list }}"
    state: present
  when: postgresql_extensions | length > 0
  become: true

- name: Install Patroni packages
  ansible.builtin.dnf:
    name:
      - "{{ postgresql_patroni_package }}"
      - "{{ postgresql_patroni_package }}-etcd"
    state: present
  become: true

- name: Install etcd from upstream binary
  ansible.builtin.include_tasks: install_etcd.yml

- name: Ensure Patroni configuration directory exists
  ansible.builtin.file:
    path: "{{ postgresql_patroni_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Ensure etcd configuration directory exists
  ansible.builtin.file:
    path: "{{ postgresql_etcd_config_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Ensure etcd data directory exists
  ansible.builtin.file:
    path: "{{ postgresql_etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"
  become: true

- name: Ensure PostgreSQL data directory exists
  ansible.builtin.file:
    path: "{{ postgresql_data_dir | dirname }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"
  become: true
