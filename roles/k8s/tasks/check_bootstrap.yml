---
# Detect whether the Kubernetes cluster has already been bootstrapped.
# This fact is only used on the bootstrap host to decide whether to run
# kubeadm init, so only the bootstrap host needs to determine it.

- name: Check if cluster admin kubeconfig exists on bootstrap host
  ansible.builtin.stat:
    path: "{{ k8s_admin_kubeconfig }}"
  register: k8s_admin_conf_stat
  when: inventory_hostname == k8s_bootstrap_host

- name: Set cluster bootstrapped fact on bootstrap host
  ansible.builtin.set_fact:
    k8s_cluster_bootstrapped: "{{ k8s_admin_conf_stat.stat.exists | default(false) }}"
  when: inventory_hostname == k8s_bootstrap_host
