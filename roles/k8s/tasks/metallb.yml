---
# Deploy MetalLB for bare-metal LoadBalancer services from the controller VM.
# The upstream manifest is applied only when the installed controller image
# differs from k8s_metallb_version: re-applying on every run would revert the
# webhook caBundle that MetalLB's controller rotates in the live CRDs. The
# speaker DaemonSet needs no toleration patch — the upstream manifest already
# tolerates the standard control-plane taint, so speakers schedule on
# control-plane nodes out of the box (revisit only if custom taints are
# introduced).

- name: Download MetalLB manifest
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/metallb/metallb/v{{ k8s_metallb_version }}/config/manifests/metallb-native.yaml"
    dest: /tmp/metallb-native.yaml
    mode: "0644"

- name: Read deployed MetalLB controller image
  ansible.builtin.command: >
    kubectl get deployment controller -n metallb-system
    -o jsonpath='{.spec.template.spec.containers[0].image}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_metallb_deployed_image
  changed_when: false
  failed_when: k8s_metallb_deployed_image.rc not in [0, 1]

- name: Apply MetalLB manifest
  ansible.builtin.command: kubectl apply -f /tmp/metallb-native.yaml
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_metallb_apply
  when: k8s_metallb_deployed_image.stdout | trim != 'quay.io/metallb/controller:v' ~ k8s_metallb_version
  changed_when: "'created' in k8s_metallb_apply.stdout or 'configured' in k8s_metallb_apply.stdout"
  failed_when: k8s_metallb_apply.rc != 0
  until: k8s_metallb_apply.rc == 0
  retries: 6
  delay: 10

- name: Patch MetalLB controller to tolerate control-plane taint
  ansible.builtin.command: >
    kubectl patch deployment controller -n metallb-system --type json
    -p '[{"op": "add", "path": "/spec/template/spec/tolerations",
    "value": [{"key": "node-role.kubernetes.io/control-plane", "operator": "Exists", "effect": "NoSchedule"}]}]'
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_metallb_controller_patch
  changed_when: k8s_metallb_controller_patch.rc == 0 and "(no change)" not in k8s_metallb_controller_patch.stdout
  failed_when: k8s_metallb_controller_patch.rc != 0
  until: k8s_metallb_controller_patch.rc == 0
  retries: 6
  delay: 10

- name: Wait for MetalLB controller deployment to be available
  ansible.builtin.command: >
    kubectl wait --namespace metallb-system
    --for=condition=available
    deployment/controller
    --timeout=300s
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false

- name: Detect network interface for MetalLB L2 advertisement
  ansible.builtin.shell: "set -o pipefail; ip -br a | grep {{ ansible_host }} | awk '!seen { print $1; seen = 1 }'"
  register: k8s_node_interface
  changed_when: false

- name: Deploy MetalLB IPAddressPool and L2Advertisement
  ansible.builtin.template:
    src: metallb-config.yaml.j2
    dest: /tmp/metallb-config.yaml
    owner: root
    group: root
    mode: "0600"

- name: Apply MetalLB configuration
  ansible.builtin.command: kubectl apply -f /tmp/metallb-config.yaml
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_metallb_config
  changed_when: "'created' in k8s_metallb_config.stdout or 'configured' in k8s_metallb_config.stdout"
  failed_when: k8s_metallb_config.rc != 0
  until: k8s_metallb_config.rc == 0
  retries: 6
  delay: 10
