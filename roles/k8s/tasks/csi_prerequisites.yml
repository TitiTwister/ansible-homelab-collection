---
# Install node-level packages required by the selected CSI.
# These tasks run on every Kubernetes node (masters and workers).

- name: Install Longhorn node prerequisites
  ansible.builtin.dnf:
    name:
      - iscsi-initiator-utils
      - nfs-utils
    state: present
  when: k8s_csi == "longhorn"

- name: Ensure iscsid is running
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
  when: k8s_csi == "longhorn"
