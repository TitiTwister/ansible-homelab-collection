---
# Deploy Forgejo (git forge) using Helm from the controller VM.

- name: Validate Forgejo configuration
  ansible.builtin.assert:
    that:
      - k8s_forgejo_hostname | length > 0
      - k8s_forgejo_ssh_hostname | length > 0
      - k8s_forgejo_loadbalancer_ip | length > 0
      - k8s_forgejo_db_host | length > 0
      - k8s_forgejo_db_ca_files | length > 0
      - k8s_forgejo_db_password | length > 0
      - "'CHANGE_ME' not in k8s_forgejo_db_password"
      - k8s_forgejo_admin_username | length > 0
      - k8s_forgejo_admin_username | trim | lower not in __k8s_forgejo_reserved_usernames
      - k8s_forgejo_admin_password | length > 0
      - "'CHANGE_ME' not in k8s_forgejo_admin_password"
    fail_msg: >-
      Forgejo is enabled but its configuration is incomplete or invalid.
      Check the k8s_forgejo_* inventory variables and the vault_forgejo.yml
      vault file. The admin username must not be one of Forgejo's reserved
      names (see __k8s_forgejo_reserved_usernames in the role vars).

- name: Concatenate CA certificates into Forgejo CA bundle
  ansible.builtin.set_fact:
    k8s_forgejo_ca_bundle: "{{ (k8s_forgejo_ca_bundle | default('')) ~ lookup('ansible.builtin.file', item) ~ '\n' }}"
  loop: "{{ k8s_forgejo_db_ca_files }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Render Forgejo secrets manifest
  ansible.builtin.template:
    src: forgejo-secrets.yaml.j2
    dest: /tmp/forgejo-secrets.yaml
    owner: root
    group: root
    mode: "0600"

- name: Ensure Forgejo namespace exists
  ansible.builtin.command: kubectl create namespace {{ k8s_forgejo_namespace }}
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_forgejo_namespace_create
  changed_when: "'created' in k8s_forgejo_namespace_create.stdout"
  # AlreadyExists is the steady state on re-runs; anything else (e.g.
  # transient etcd timeouts) is retried by until below.
  failed_when: k8s_forgejo_namespace_create.rc != 0 and 'AlreadyExists' not in k8s_forgejo_namespace_create.stderr
  until: k8s_forgejo_namespace_create.rc == 0 or 'AlreadyExists' in k8s_forgejo_namespace_create.stderr
  retries: 5
  delay: 10

- name: Apply Forgejo secrets
  ansible.builtin.command: kubectl apply -f /tmp/forgejo-secrets.yaml
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_forgejo_secrets_apply
  changed_when: "'created' in k8s_forgejo_secrets_apply.stdout or 'configured' in k8s_forgejo_secrets_apply.stdout"
  until: k8s_forgejo_secrets_apply.rc == 0
  retries: 5
  delay: 10
  notify: Restart Forgejo deployment

- name: Render Forgejo Helm values
  ansible.builtin.template:
    src: forgejo-values.yaml.j2
    dest: /tmp/forgejo-values.yaml
    owner: root
    group: root
    mode: "0600"

- name: Read deployed Forgejo release metadata
  ansible.builtin.command: >
    /usr/local/bin/helm get metadata forgejo
    --namespace {{ k8s_forgejo_namespace }} -o json
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_forgejo_release
  changed_when: false
  failed_when: k8s_forgejo_release.rc not in [0, 1]
  when: not ansible_check_mode

- name: Read deployed Forgejo values
  ansible.builtin.command: >
    /usr/local/bin/helm get values forgejo
    --namespace {{ k8s_forgejo_namespace }} -o json
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_forgejo_values_deployed
  changed_when: false
  failed_when: k8s_forgejo_values_deployed.rc not in [0, 1]
  when: not ansible_check_mode

- name: Read rendered Forgejo values
  ansible.builtin.slurp:
    src: /tmp/forgejo-values.yaml
  register: k8s_forgejo_values_rendered
  when: not ansible_check_mode

- name: Install or upgrade Forgejo
  ansible.builtin.command: >
    /usr/local/bin/helm upgrade --install forgejo
    oci://code.forgejo.org/forgejo-helm/forgejo
    --version {{ k8s_forgejo_chart_version }}
    --namespace {{ k8s_forgejo_namespace }}
    --create-namespace
    -f /tmp/forgejo-values.yaml
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_forgejo_helm
  # helm has no server-side diffing: it always prints "has been upgraded"
  # and bumps the release revision. Only run the upgrade when the release,
  # chart version or values actually differ.
  when: >
    k8s_forgejo_release.rc | default(1) != 0
    or (k8s_forgejo_release.stdout | from_json).status != "deployed"
    or (k8s_forgejo_release.stdout | from_json).version != k8s_forgejo_chart_version
    or (k8s_forgejo_values_deployed.stdout | from_json) != (k8s_forgejo_values_rendered.content | b64decode | from_yaml)
  changed_when: "'STATUS: deployed' in k8s_forgejo_helm.stdout or 'has been upgraded' in k8s_forgejo_helm.stdout"
  until: k8s_forgejo_helm.rc == 0
  retries: 3
  delay: 60

- name: Flush pending handlers before waiting for Forgejo
  ansible.builtin.meta: flush_handlers

- name: Wait for Forgejo deployment to be available
  ansible.builtin.command: >
    kubectl wait --namespace {{ k8s_forgejo_namespace }}
    --for=condition=available
    deployment/forgejo
    --timeout=600s
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false

- name: Wait for Forgejo LoadBalancer IP assignment
  ansible.builtin.command: >
    kubectl get svc forgejo-http -n {{ k8s_forgejo_namespace }}
    -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_forgejo_lb_ip
  until: k8s_forgejo_lb_ip.rc == 0 and k8s_forgejo_lb_ip.stdout == k8s_forgejo_loadbalancer_ip
  retries: 30
  delay: 5
  changed_when: false
  when: not ansible_check_mode

- name: Verify the Forgejo admin account is usable over the API
  block:
    # Forgejo answers 403 to every API request while an account has
    # must_change_password set, and 401 to wrong credentials; both are
    # read here and judged by failed_when so the rescue can explain them.
    - name: Read the Forgejo admin account over the API
      ansible.builtin.uri:
        url: "{{ k8s_forgejo_api_url }}/user"
        method: GET
        url_username: "{{ k8s_forgejo_admin_username }}"
        url_password: "{{ k8s_forgejo_admin_password }}"
        force_basic_auth: true
        status_code: [200, 401, 403]
        timeout: 30
      register: k8s_forgejo_admin_check
      changed_when: false
      failed_when: >-
        k8s_forgejo_admin_check.status != 200
        or not ((k8s_forgejo_admin_check.json | default({})).is_admin | default(false) | bool)
        or ((k8s_forgejo_admin_check.json | default({})).must_change_password | default(false) | bool)
      no_log: true
      when: not ansible_check_mode
  rescue:
    - name: Report the unusable Forgejo admin account
      ansible.builtin.fail:
        msg: >-
          The Forgejo admin account '{{ k8s_forgejo_admin_username }}' cannot
          use the API (HTTP {{ k8s_forgejo_admin_check.status | default('connection failed') }},
          {{ (k8s_forgejo_admin_check.json | default({})).message | default('no response message') }}).
          HTTP 401 means the vault_forgejo_admin_password value no longer
          matches the account. HTTP 403 with "must change your password"
          means the account is stuck in the must-change-password state:
          Forgejo rejects every API request until the password is changed,
          which never happens for this API-only account — check that the
          helm chart value gitea.admin.passwordMode is keepUpdated (the
          chart then re-applies the vault password with the flag cleared
          on every start). Otherwise the account lacks site-admin rights;
          promote it in the Forgejo web UI.

- name: Deploy Forgejo Actions runner
  ansible.builtin.include_tasks: app_forgejo_runner.yml
  when: k8s_forgejo_runner_enabled | bool
