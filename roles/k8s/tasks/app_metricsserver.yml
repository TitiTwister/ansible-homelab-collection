---
# Deploy metrics-server using Helm from the controller VM.
# Provides the Metrics API consumed by `kubectl top` and HPA. In-cluster
# only: no NodePort, no external exposure.

- name: Ensure metrics-server Helm repository is added
  ansible.builtin.command: /usr/local/bin/helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
  register: k8s_metricsserver_repo_add
  # helm >= 3.17 succeeds when the repository already exists, making this
  # cache maintenance like the repo update below. On older helm the
  # already-exists error is tolerated instead of failing.
  changed_when: false
  failed_when:
    - k8s_metricsserver_repo_add.rc != 0
    - "'already exists' not in k8s_metricsserver_repo_add.stderr"

- name: Update Helm repositories
  ansible.builtin.command: /usr/local/bin/helm repo update
  changed_when: false

- name: Render metrics-server Helm values
  ansible.builtin.template:
    src: metricsserver-values.yaml.j2
    dest: /tmp/metricsserver-values.yaml
    owner: root
    group: root
    mode: "0600"

- name: Read deployed metrics-server release metadata
  ansible.builtin.command: >
    /usr/local/bin/helm get metadata metrics-server
    --namespace {{ k8s_metricsserver_namespace }} -o json
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_metricsserver_release
  changed_when: false
  failed_when: k8s_metricsserver_release.rc not in [0, 1]
  when: not ansible_check_mode

- name: Read deployed metrics-server values
  ansible.builtin.command: >
    /usr/local/bin/helm get values metrics-server
    --namespace {{ k8s_metricsserver_namespace }} -o json
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_metricsserver_values_deployed
  changed_when: false
  failed_when: k8s_metricsserver_values_deployed.rc not in [0, 1]
  when: not ansible_check_mode

- name: Read rendered metrics-server values
  ansible.builtin.slurp:
    src: /tmp/metricsserver-values.yaml
  register: k8s_metricsserver_values_rendered
  when: not ansible_check_mode

- name: Install or upgrade metrics-server
  ansible.builtin.command: >
    /usr/local/bin/helm upgrade --install metrics-server
    metrics-server/metrics-server
    --version {{ k8s_metricsserver_chart_version }}
    --namespace {{ k8s_metricsserver_namespace }}
    --create-namespace
    -f /tmp/metricsserver-values.yaml
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_metricsserver_helm
  # helm has no server-side diffing: it always prints "has been upgraded"
  # and bumps the release revision. Only run the upgrade when the release,
  # chart version or values actually differ.
  when: >
    k8s_metricsserver_release.rc | default(1) != 0
    or (k8s_metricsserver_release.stdout | from_json).status != "deployed"
    or (k8s_metricsserver_release.stdout | from_json).version != k8s_metricsserver_chart_version
    or (k8s_metricsserver_values_deployed.stdout | from_json) != (k8s_metricsserver_values_rendered.content | b64decode | from_yaml)
  changed_when: "'STATUS: deployed' in k8s_metricsserver_helm.stdout or 'has been upgraded' in k8s_metricsserver_helm.stdout"
  until: k8s_metricsserver_helm.rc == 0
  retries: 3
  delay: 30

- name: Wait for metrics-server deployment to be available
  ansible.builtin.command: >
    kubectl --namespace {{ k8s_metricsserver_namespace }}
    wait --for=condition=available
    deployment/metrics-server
    --timeout=300s
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false
