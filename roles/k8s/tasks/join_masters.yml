---
# Join additional control-plane nodes to the cluster

- name: Check if this master is already joined
  ansible.builtin.stat:
    path: "{{ k8s_admin_kubeconfig }}"
  register: k8s_master_joined_stat

- name: Retrieve bootstrap token from bootstrap master
  ansible.builtin.shell: |
    set -o pipefail
    kubeadm token list |
    awk '/authentication,signing/ && !seen { print $1; seen = 1 }'
  delegate_to: "{{ k8s_bootstrap_host }}"
  environment:
    KUBECONFIG: /root/kubeadm-local-admin.conf
  register: k8s_token_retrieve
  changed_when: false
  failed_when: k8s_token_retrieve.rc != 0
  when: not k8s_master_joined_stat.stat.exists

- name: Create bootstrap token when none exists
  ansible.builtin.command: kubeadm token create --ttl 24h --description "ansible-k8s-bootstrap"
  delegate_to: "{{ k8s_bootstrap_host }}"
  environment:
    KUBECONFIG: /root/kubeadm-local-admin.conf
  register: k8s_token_create
  changed_when: true
  when:
    - not k8s_master_joined_stat.stat.exists
    - k8s_token_retrieve.stdout | length == 0

- name: Set bootstrap token fact
  ansible.builtin.set_fact:
    k8s_bootstrap_token: "{{ k8s_token_retrieve.stdout or (k8s_token_create.stdout | default('')) }}"
  when: not k8s_master_joined_stat.stat.exists

- name: Retrieve CA certificate hash from bootstrap master
  ansible.builtin.shell: |
    set -o pipefail
    openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt |
    openssl rsa -pubin -outform der 2>/dev/null |
    openssl dgst -sha256 -hex |
    sed 's/^.* //'
  delegate_to: "{{ k8s_bootstrap_host }}"
  environment:
    KUBECONFIG: /root/kubeadm-local-admin.conf
  register: k8s_ca_hash_retrieve
  changed_when: false
  failed_when: k8s_ca_hash_retrieve.rc != 0
  when: not k8s_master_joined_stat.stat.exists

- name: Set CA certificate hash fact
  ansible.builtin.set_fact:
    k8s_ca_cert_hash: "sha256:{{ k8s_ca_hash_retrieve.stdout }}"
  when:
    - not k8s_master_joined_stat.stat.exists
    - k8s_ca_hash_retrieve.stdout | length > 0

- name: Generate new certificate key on bootstrap master
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  delegate_to: "{{ k8s_bootstrap_host }}"
  run_once: true
  environment:
    KUBECONFIG: /root/kubeadm-local-admin.conf
  register: k8s_cert_key_output
  when: not k8s_master_joined_stat.stat.exists
  changed_when: true

- name: Extract certificate key from stdout_lines
  ansible.builtin.set_fact:
    k8s_certificate_key: "{{ k8s_cert_key_output.stdout_lines | last | trim }}"
  when:
    - not k8s_master_joined_stat.stat.exists
    - k8s_cert_key_output is defined
    - k8s_cert_key_output.stdout_lines is defined

- name: Create kubeadm join configuration for control plane
  ansible.builtin.template:
    src: kubeadm-join-master-config.yaml.j2
    dest: /root/kubeadm-join-master-config.yaml
    owner: root
    group: root
    mode: "0600"
  when: not k8s_master_joined_stat.stat.exists

- name: Join control plane node to cluster
  ansible.builtin.command: >
    kubeadm join
    --config=/root/kubeadm-join-master-config.yaml
    --node-name={{ inventory_hostname }}
  args:
    creates: "{{ k8s_admin_kubeconfig }}"
  when: not k8s_master_joined_stat.stat.exists
