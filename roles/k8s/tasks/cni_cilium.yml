---
# Deploy Cilium CNI using Helm

- name: Ensure Cilium Helm repository is added
  ansible.builtin.command: /usr/local/bin/helm repo add cilium https://helm.cilium.io/
  register: k8s_cilium_repo_add
  # helm >= 3.17 succeeds when the repository already exists, making this
  # cache maintenance like the repo update below. On older helm the
  # already-exists error is tolerated instead of failing.
  changed_when: false
  failed_when:
    - k8s_cilium_repo_add.rc != 0
    - "'already exists' not in k8s_cilium_repo_add.stderr"

- name: Update Helm repositories
  ansible.builtin.command: /usr/local/bin/helm repo update
  changed_when: false

- name: Render Cilium Helm values
  ansible.builtin.template:
    src: cilium-values.yaml.j2
    dest: /tmp/cilium-values.yaml
    owner: root
    group: root
    mode: "0600"

- name: Read deployed Cilium release metadata
  ansible.builtin.command: >
    /usr/local/bin/helm get metadata cilium --namespace kube-system -o json
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_cilium_release
  changed_when: false
  failed_when: k8s_cilium_release.rc not in [0, 1]
  when: not ansible_check_mode

- name: Read deployed Cilium values
  ansible.builtin.command: >
    /usr/local/bin/helm get values cilium --namespace kube-system -o json
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_cilium_values_deployed
  changed_when: false
  failed_when: k8s_cilium_values_deployed.rc not in [0, 1]
  when: not ansible_check_mode

- name: Read rendered Cilium values
  ansible.builtin.slurp:
    src: /tmp/cilium-values.yaml
  register: k8s_cilium_values_rendered
  when: not ansible_check_mode

- name: Install or upgrade Cilium
  ansible.builtin.command: >
    /usr/local/bin/helm upgrade --install cilium cilium/cilium
    --version {{ k8s_cilium_version }}
    --namespace kube-system
    -f /tmp/cilium-values.yaml
  environment:
    KUBECONFIG: /root/.kube/config
  register: k8s_cilium_helm
  # helm has no server-side diffing: it always prints "has been upgraded"
  # and bumps the release revision. Only run the upgrade when the release,
  # chart version or values actually differ.
  when: >
    k8s_cilium_release.rc | default(1) != 0
    or (k8s_cilium_release.stdout | from_json).status != "deployed"
    or (k8s_cilium_release.stdout | from_json).version != k8s_cilium_version
    or (k8s_cilium_values_deployed.stdout | from_json) != (k8s_cilium_values_rendered.content | b64decode | from_yaml)
  changed_when: "'STATUS: deployed' in k8s_cilium_helm.stdout or 'has been upgraded' in k8s_cilium_helm.stdout"
  failed_when: k8s_cilium_helm.rc != 0
