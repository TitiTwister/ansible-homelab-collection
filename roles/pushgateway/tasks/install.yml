---
# Install Pushgateway on Rocky Linux

- name: Add Pushgateway group
  ansible.builtin.group:
    name: "{{ pushgateway_group }}"
    system: true
    state: present

- name: Add Pushgateway user
  ansible.builtin.user:
    name: "{{ pushgateway_user }}"
    group: "{{ pushgateway_group }}"
    system: true
    shell: /bin/false
    home: "{{ pushgateway_config_dir }}"
    create_home: false

- name: Create Pushgateway configuration directory
  ansible.builtin.file:
    path: "{{ pushgateway_config_dir }}"
    state: directory
    owner: "{{ pushgateway_user }}"
    group: "{{ pushgateway_group }}"
    mode: '0755'

- name: Ensure Pushgateway data directory exists
  ansible.builtin.file:
    path: "{{ pushgateway_data_dir }}"
    state: directory
    owner: "{{ pushgateway_user }}"
    group: "{{ pushgateway_group }}"
    mode: '0755'

- name: Download Pushgateway
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/pushgateway/releases/download/v{{ pushgateway_version }}/pushgateway-{{ pushgateway_version }}.linux-amd64.tar.gz"
    dest: "/tmp/pushgateway-{{ pushgateway_version }}.linux-amd64.tar.gz"
    mode: '0644'

- name: Extract Pushgateway
  ansible.builtin.unarchive:
    src: "/tmp/pushgateway-{{ pushgateway_version }}.linux-amd64.tar.gz"
    dest: /tmp/
    remote_src: true
    creates: "/tmp/pushgateway-{{ pushgateway_version }}.linux-amd64"

- name: Install Pushgateway binary
  ansible.builtin.copy:
    src: "/tmp/pushgateway-{{ pushgateway_version }}.linux-amd64/pushgateway"
    dest: /usr/local/bin/pushgateway
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  notify: Restart pushgateway

- name: Create Pushgateway systemd service
  ansible.builtin.template:
    src: pushgateway.service.j2
    dest: /etc/systemd/system/pushgateway.service
    mode: '0644'
  notify: Restart pushgateway

- name: Enable Pushgateway service
  ansible.builtin.systemd:
    name: pushgateway
    enabled: true
    daemon_reload: true
