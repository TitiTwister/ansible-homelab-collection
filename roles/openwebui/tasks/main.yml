---
# Main tasks for the openwebui role. The container runtime is not
# installed here: apply the docker role first (nvidia_docker on GPU
# hosts provides it).

- name: Configure Open WebUI service
  ansible.builtin.import_tasks: configure.yml

- name: Apply configuration changes before verification
  ansible.builtin.meta: flush_handlers

- name: Verify Open WebUI deployment
  ansible.builtin.import_tasks: verify.yml
