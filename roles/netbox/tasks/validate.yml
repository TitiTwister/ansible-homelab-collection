---
# Fail fast on missing secrets and inputs, before anything touches
# the host. All secrets live in the vault file and are mapped in the
# inventory's vars_netbox.yml.

- name: Validate the NetBox secrets and hostnames
  ansible.builtin.assert:
    that:
      - netbox_secret_key | string | length > 0
      - netbox_postgres_password | string | length > 0
      - netbox_redis_password | string | length > 0
      - netbox_superuser_password | string | length > 0
      - netbox_superuser_name | string | length > 0
      - netbox_allowed_hosts | length > 0
      - netbox_csrf_trusted_origins | length > 0
      - netbox_plugins | length > 0
    fail_msg: >-
      netbox_secret_key, netbox_postgres_password, netbox_redis_password
      and netbox_superuser_password must be set — the secrets live in
      vault_netbox.yml and are mapped in vars_netbox.yml in the
      inventory — and netbox_allowed_hosts / netbox_csrf_trusted_origins
      must list the service hostname(s) served by the load balancer.
