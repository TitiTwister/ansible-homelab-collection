---
# Default variables for grafana role

grafana_port: 3000
grafana_admin_user: admin
# Override this in group_vars or vault; it is required when deploying grafana.ini.
# grafana_admin_password: "CHANGEME"

grafana_data_dir: /var/lib/grafana
grafana_config_dir: /etc/grafana
grafana_provisioning_dir: "{{ grafana_config_dir }}/provisioning"

# List of Prometheus endpoints to add as data sources.
# Defaults to all hosts in the prometheus group; override this if your
# inventory uses a different group name.
grafana_prometheus_group: prometheus
grafana_prometheus_port: 9090

# Loki API endpoint for the log data source; empty disables it.
grafana_loki_url: ""

# Absolute path on the control node where dashboard JSON files are stored.
# Must be defined in inventory to enable dashboard provisioning; the role
# skips dashboards when it is unset.
# grafana_dashboards_src: "/path/to/dashboards"

# Firewall configuration
grafana_firewall_zone: public
