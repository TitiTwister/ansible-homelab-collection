---
# Install step-cli and step-ca binaries

- name: Install required packages
  ansible.builtin.dnf:
    name:
      - acl
      - ca-certificates
      - curl
      - tar
    state: present
  become: true

# step-cli
- name: Check if step-cli is installed
  ansible.builtin.stat:
    path: /usr/local/bin/step
  register: step_ca_cli_stat

- name: Download step-cli tarball
  ansible.builtin.get_url:
    url: "https://dl.smallstep.com/gh-release/cli/gh-release-header/v{{ step_ca_cli_version }}/step_linux_{{ step_ca_cli_version }}_amd64.tar.gz"
    dest: "/tmp/step_linux_{{ step_ca_cli_version }}_amd64.tar.gz"
    mode: "0644"
  when: not step_ca_cli_stat.stat.exists
  become: true

- name: Extract step-cli
  ansible.builtin.unarchive:
    src: "/tmp/step_linux_{{ step_ca_cli_version }}_amd64.tar.gz"
    dest: /tmp
    remote_src: true
  when: not step_ca_cli_stat.stat.exists
  become: true

- name: Install step-cli binary
  ansible.builtin.copy:
    src: "/tmp/step_{{ step_ca_cli_version }}/bin/step"
    dest: /usr/local/bin/step
    mode: "0755"
    remote_src: true
  when: not step_ca_cli_stat.stat.exists
  become: true

# step-ca
- name: Check if step-ca is installed
  ansible.builtin.stat:
    path: /usr/local/bin/step-ca
  register: step_ca_stat

- name: Download step-ca tarball
  ansible.builtin.get_url:
    url: "https://dl.smallstep.com/gh-release/certificates/gh-release-header/v{{ step_ca_version }}/step-ca_linux_{{ step_ca_version }}_amd64.tar.gz"
    dest: "/tmp/step-ca_linux_{{ step_ca_version }}_amd64.tar.gz"
    mode: "0644"
  when: not step_ca_stat.stat.exists
  become: true

- name: Extract step-ca
  ansible.builtin.unarchive:
    src: "/tmp/step-ca_linux_{{ step_ca_version }}_amd64.tar.gz"
    dest: /tmp
    remote_src: true
  when: not step_ca_stat.stat.exists
  become: true

- name: Install step-ca binary
  ansible.builtin.copy:
    src: "/tmp/step-ca"
    dest: /usr/local/bin/step-ca
    mode: "0755"
    remote_src: true
  when: not step_ca_stat.stat.exists
  become: true
