---
# Persistent directories, created before any content lands in them:
# the data tree on the data disk and the model subdirectories from
# comfyui_models.

- name: Create ComfyUI data directories
  ansible.builtin.file:
    path: "{{ comfyui_data_dir }}/{{ item.local }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ __comfyui_volumes }}"
  loop_control:
    label: "{{ item.local }}"

- name: Create model subdirectories
  ansible.builtin.file:
    path: "{{ comfyui_data_dir }}/models/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ comfyui_models | map(attribute='subdir') | unique | list }}"
  loop_control:
    label: "{{ item }}"
