---
# Handlers for comfyui role. Driver/container-runtime handlers live in
# the nvidia_docker dependency.

- name: Restart comfyui
  # Skipped while paused (comfyui_state == "stopped"): a restart would
  # start the service and re-grab the GPU. Configuration changes made
  # while paused are applied by the next start.
  ansible.builtin.systemd:
    name: comfyui
    state: restarted
    daemon_reload: true
  when: comfyui_state == 'started'
