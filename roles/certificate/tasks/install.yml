---
# Install dependencies for the certificate role

- name: Ensure openssl is installed
  ansible.builtin.dnf:
    name: openssl
    state: present
  become: true

- name: Ensure certbot and RFC2136 plugin are installed
  ansible.builtin.dnf:
    name:
      - certbot
      - python3-certbot-dns-rfc2136
    state: present
  become: true
