---
# Fetch OpenVPN certificates from the PKI host
# Check if certs already exist on OVPN server, if not SCP tarball and extract

- name: Check if OpenVPN CA cert already exists
  ansible.builtin.stat:
    path: "{{ openvpn_cert_dir }}/ca.crt"
  register: openvpn_ca_stat

- name: Fetch and extract OpenVPN certs tarball from the PKI host
  when: not openvpn_ca_stat.stat.exists
  block:
    - name: SCP OpenVPN certs tarball from the PKI host
      ansible.builtin.command: >
        scp -i {{ openvpn_pki_ssh_key }}
        {{ openvpn_pki_user }}@{{ openvpn_pki_host }}:/tmp/ovpn-certs.tar.gz
        /tmp/ovpn-certs.tar.gz
      become: true
      no_log: true
      changed_when: true

    - name: Extract OpenVPN certs tarball
      ansible.builtin.unarchive:
        src: /tmp/ovpn-certs.tar.gz
        dest: "{{ openvpn_cert_dir }}/.."
        remote_src: true
      become: true
      notify: Restart OpenVPN

    - name: Cleanup temp tarball
      ansible.builtin.file:
        path: /tmp/ovpn-certs.tar.gz
        state: absent

- name: Move CA chain to expected location
  ansible.builtin.copy:
    src: "{{ openvpn_cert_dir }}/../ca-chain.crt"
    dest: "{{ openvpn_cert_dir }}/ca.crt"
    remote_src: true
    mode: "0644"
  become: true
  notify: Restart OpenVPN

- name: Remove CA chain source file
  ansible.builtin.file:
    path: "{{ openvpn_cert_dir }}/../ca-chain.crt"
    state: absent
  become: true
