---
# Install Loki on Rocky Linux

- name: Add Loki group
  ansible.builtin.group:
    name: "{{ loki_group }}"
    system: true
    state: present

- name: Add Loki user
  ansible.builtin.user:
    name: "{{ loki_user }}"
    group: "{{ loki_group }}"
    system: true
    shell: /bin/false
    home: "{{ loki_config_dir }}"
    create_home: false

- name: Create Loki configuration directory
  ansible.builtin.file:
    path: "{{ loki_config_dir }}"
    state: directory
    owner: "{{ loki_user }}"
    group: "{{ loki_group }}"
    mode: '0755'

- name: Ensure Loki data directory exists
  ansible.builtin.file:
    path: "{{ loki_data_dir }}"
    state: directory
    owner: "{{ loki_user }}"
    group: "{{ loki_group }}"
    mode: '0755'

- name: Install unzip for the Loki release archive
  ansible.builtin.dnf:
    name: unzip
    state: present

- name: Download Loki
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/loki-linux-amd64.zip"
    dest: "/tmp/loki-{{ loki_version }}-linux-amd64.zip"
    mode: '0644'

- name: Create Loki extraction directory
  ansible.builtin.file:
    path: "/tmp/loki-{{ loki_version }}-linux-amd64"
    state: directory
    mode: '0755'

- name: Extract Loki
  ansible.builtin.unarchive:
    src: "/tmp/loki-{{ loki_version }}-linux-amd64.zip"
    dest: "/tmp/loki-{{ loki_version }}-linux-amd64"
    remote_src: true
    creates: "/tmp/loki-{{ loki_version }}-linux-amd64/loki-linux-amd64"

- name: Install Loki binary
  ansible.builtin.copy:
    src: "/tmp/loki-{{ loki_version }}-linux-amd64/loki-linux-amd64"
    dest: /usr/local/bin/loki
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  notify: Restart loki

- name: Create Loki systemd service
  ansible.builtin.template:
    src: loki.service.j2
    dest: /etc/systemd/system/loki.service
    mode: '0644'
  notify: Restart loki

- name: Enable Loki service
  ansible.builtin.systemd:
    name: loki
    enabled: true
    daemon_reload: true
