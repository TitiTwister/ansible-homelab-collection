---
# Docker CE from the upstream repository, shared by the container
# workload roles (netbox, openwebui). This role deliberately does not
# deploy daemon.json: on GPU hosts the nvidia_docker role owns it
# (nvidia runtime) and provides the whole runtime - do not apply both
# roles on the same host, or two roles would write
# /etc/containerd/config.toml.

- name: Add Docker CE repository (RHEL)
  ansible.builtin.yum_repository:
    name: docker-ce
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/rhel/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/rhel/gpg
    enabled: true
  when: ansible_facts.distribution == "RedHat"

- name: Add Docker CE repository (Rocky/Alma/CentOS)
  ansible.builtin.yum_repository:
    name: docker-ce
    description: Docker CE Stable
    baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/centos/gpg
    enabled: true
  when: ansible_facts.distribution in ["Rocky", "AlmaLinux", "CentOS"]

- name: Install Docker CE
  ansible.builtin.dnf:
    name: "{{ __docker_packages }}"
    state: present

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_containerd_root | length > 0

- name: Deploy containerd configuration
  # Docker 28 uses the containerd image store: image layers live in
  # containerd's data root, not in Docker's data-root. Relocate it to
  # the data disk when multi-GB images do not fit the system volume.
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  when: docker_containerd_root | length > 0
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
